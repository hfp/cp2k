# Three OT steps exercise LDA/GGA energies and orbital updates; not SCF references.
# PBE covers spin exchange and cancellation against stored high-spin references.
"O2-pade.inp"              = [{matcher = "E_total", tol = 1e-11, ref = -144.24875823872887}]
"O2-pbe.inp"               = [{matcher = "E_total", tol = 1e-11, ref = -145.1433062898162}]
"O2-pbe-spinflip.inp"      = [{matcher = "E_total", tol = 1e-11, ref = -145.1433062898135}]
"O2-pbe-cancel.inp"        = [{matcher = "E_total", tol = 1e-11, ref = -145.16079471244151}]
# Restart files must preserve shared orbitals; tiny OT steps isolate this behavior.
"O2-pbe-restart-write.inp" = [{matcher = "E_total", tol = 1e-10, ref = -141.15493129382511}]
"O2-pbe-restart-read.inp"  = [{matcher = "E_total", tol = 1e-10, ref = -141.1549376393432}]
